proxy_cache_path /var/cache/nginx/pasco-lab
  levels=1:2
  keys_zone=pasco_pages:50m
  max_size=2g
  inactive=30m
  use_temp_path=off;

limit_req_zone $binary_remote_addr zone=pasco_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pasco_uploads:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=pasco_api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=pasco_public:10m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=pasco_conn:10m;

map $request_method $pasco_cache_method_bypass {
  default 1;
  GET 0;
  HEAD 0;
}

map $args $pasco_cache_args_bypass {
  default 1;
  "" 0;
}

map $http_rsc $pasco_cache_rsc_bypass {
  default 1;
  "" 0;
}

map $http_next_router_state_tree $pasco_cache_router_state_bypass {
  default 1;
  "" 0;
}

map $http_next_router_prefetch $pasco_cache_prefetch_bypass {
  default 1;
  "" 0;
}

map $http_next_router_segment_prefetch $pasco_cache_segment_prefetch_bypass {
  default 1;
  "" 0;
}

map $http_cookie $pasco_cache_cookie_bypass {
  default 0;
  ~*pasco_admin_auth 1;
}

map $http_cookie $pasco_locale_cache_key {
  default "default";
  ~*(?:^|;\s*)pasco_locale=([^;]+) $1;
}

map $uri $pasco_cache_uri_bypass {
  default 0;
  ~^/admin 1;
  ~^/sersdp 1;
  ~^/login 1;
  ~^/api/admin 1;
  ~^/api/uploads 1;
  ~^/api/lab-photos 1;
  ~^/api/photos 1;
  ~^/api/locale 1;
  ~^/auth 1;
  ~^/reset-password 1;
  ~^/uploads 1;
  ~^/sparkvue 1;
  ~^/whatsnew 1;
}
