server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name __DOMAIN__;
  server_tokens off;

  client_max_body_size 100m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn pasco_conn 1000;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_static on;
  gzip_vary on;
  gzip_types application/javascript application/json application/manifest+json application/wasm image/svg+xml text/css text/javascript text/plain;

  set $app_csp "base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  set $sparkvue_csp "default-src 'self' blob: data:; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; frame-src 'self' blob: data:; img-src 'self' data: blob:; manifest-src 'self'; media-src 'self' data: blob:; object-src 'none'; prefetch-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:";

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 10s;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  proxy_cache pasco_pages;
  proxy_cache_key "$scheme|$request_method|$host|$request_uri|locale=$pasco_locale_cache_key";
  proxy_cache_methods GET HEAD;
  proxy_cache_valid 200 30s;
  proxy_cache_valid 301 302 10m;
  proxy_cache_lock on;
  proxy_cache_background_update on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_ignore_headers Cache-Control Expires;
  proxy_cache_bypass
    $pasco_cache_method_bypass
    $pasco_cache_args_bypass
    $pasco_cache_rsc_bypass
    $pasco_cache_router_state_bypass
    $pasco_cache_prefetch_bypass
    $pasco_cache_segment_prefetch_bypass
    $pasco_cache_cookie_bypass
    $pasco_cache_uri_bypass;
  proxy_no_cache
    $pasco_cache_method_bypass
    $pasco_cache_args_bypass
    $pasco_cache_rsc_bypass
    $pasco_cache_router_state_bypass
    $pasco_cache_prefetch_bypass
    $pasco_cache_segment_prefetch_bypass
    $pasco_cache_cookie_bypass
    $pasco_cache_uri_bypass
    $upstream_http_set_cookie;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-DNS-Prefetch-Control;
  proxy_hide_header X-Frame-Options;

  location = /sparkvue/index.html {
    alias __APP_DIR__/sparkvue-pwa/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /sparkvue/pasco-lab-bridge.js {
    alias __APP_DIR__/sparkvue-pwa/pasco-lab-bridge.js;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /sparkvue/javascripts/blockly-namespace-compat.js {
    alias __APP_DIR__/sparkvue-pwa/javascripts/blockly-namespace-compat.js;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /sparkvue/javascripts/offline_guard.js {
    alias __APP_DIR__/sparkvue-pwa/javascripts/offline_guard.js;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /sparkvue/spark.wasm {
    alias __APP_DIR__/sparkvue-pwa/spark.wasm;
    default_type application/wasm;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /sparkvue/ {
    alias __APP_DIR__/sparkvue-pwa/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /whatsnew/ {
    return 302 /whatsnew/WhatsNew_kkz.htm;
  }

  location = /whatsnew/index.html {
    alias __APP_DIR__/sparkvue-pwa/whatsnew/WhatsNew_kkz.htm;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /whatsnew/ {
    alias __APP_DIR__/sparkvue-pwa/whatsnew/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header Content-Security-Policy "$sparkvue_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /uploads/ {
    if ($uri ~* "\.(svg|html?|xhtml|xml|js|mjs|css|wasm)$") {
      return 403;
    }

    alias __APP_DIR__/public/uploads/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "$app_csp" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "bluetooth=(self), cross-origin-isolated=(self), serial=(self), usb=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /sersdp/login {
    limit_req zone=pasco_auth burst=10 nodelay;
    proxy_cache off;
    add_header Content-Security-Policy "$app_csp" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_pass http://127.0.0.1:3000;
  }

  location = /api/uploads {
    limit_req zone=pasco_uploads burst=10 nodelay;
    proxy_cache off;
    add_header Content-Security-Policy "$app_csp" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_pass http://127.0.0.1:3000;
  }

  location ^~ /api/ {
    limit_req zone=pasco_api burst=500 nodelay;
    add_header Content-Security-Policy "$app_csp" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_pass http://127.0.0.1:3000;
  }

  location / {
    limit_req zone=pasco_public burst=1000 nodelay;
    add_header Content-Security-Policy "$app_csp" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_pass http://127.0.0.1:3000;
  }
}
