name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Позволяет запускать деплой вручную кнопкой "Run workflow"

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Run lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build project
        run: npm run build

      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "🚀 Начинаем деплой на Hetzner VPS..."

            # 1. Перейти в папку проекта
            cd /var/www/project1

            # 1.1. Бэкап uploads (файлы лабораторий) перед деплоем
            if [ -d public/uploads ] && [ -n "$(ls -A public/uploads 2>/dev/null)" ]; then
              mkdir -p /var/backups/pasco-uploads
              cp -r public/uploads/. /var/backups/pasco-uploads/ 2>/dev/null || true
              echo "Бэкап uploads сохранён в /var/backups/pasco-uploads"
            fi

            # 2. Обновить код из GitHub
            git fetch --force origin ${{ github.sha }}
            git checkout --force ${{ github.sha }}


            # 3. Установить зависимости
            npm ci

            # 4. Собрать production build
            npm run build

            # 5. Предварительное сжатие SPARKvue
            find sparkvue-pwa -type f \( -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.wasm' \) -exec gzip -9 -k -f {} \; 2>/dev/null || true

            # 5.1. Убедиться, что Nginx может читать загруженные PDF/видео/изображения
            if [ -d public/uploads ]; then
              find public/uploads -type d -exec chmod 755 {} \;
              find public/uploads -type f -exec chmod 644 {} \;
            fi

            # 6. Перезапустить приложение через PM2
            pm2 startOrReload scripts/pm2-ecosystem.config.js --only pasco-lab-portal --update-env
            pm2 save

            # 7. Проверить, что приложение работает
            sleep 3
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:3000/ || echo "⚠️ Приложение не отвечает на localhost:3000"

            echo "✅ Деплой завершён успешно!"
